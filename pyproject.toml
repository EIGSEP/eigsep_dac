[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eigsep-dac"
version = "0.2.0"
description = "RFSoC2x2 DAC programming and pseudorandom waveform generation"
requires-python = ">=3.9"
dependencies = [
    "numpy",
]
# casperfpga is required at runtime by program_board.main() but is not on
# PyPI (EIGSEP fork: github.com/EIGSEP/casperfpga). On field nodes it's
# installed from pre-built aarch64 wheels staged in the eigsep-field
# wheelhouse. Kept out of [dependencies] so dev installs and the waveform
# module don't need it.

[project.optional-dependencies]
dev = ["matplotlib", "scipy", "jupyter"]

[project.scripts]
eigsep-dac-program = "eigsep_dac.program_board:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 79
# notebooks/ and the archive/ dirs are preserved as-is (see README layout);
# lint only the live package and scripts.
extend-exclude = ["notebooks", "scripts/archive", "build"]

[tool.ruff.lint]
extend-ignore = ["E203"]

[tool.ruff.lint.per-file-ignores]
"src/*/__init__.py" = ["F401"]
# dual_bram_mts_npz_loader.py must sys.path-insert the on-board casperfpga
# checkout before importing it.
"scripts/*.py" = ["E402"]
